<!DOCTYPE html>
<!--
  Output box for main.mlapp (shown in the OutputDisplay uihtml component).
  The app sends the message text through htmlComponent.Data (see setOutput);
  it is shown as plain text, wrapped, and scrolls if it doesn't fit.
  Table lines (starting "Bus No:" or "b<number>:", as written by
  layoutReport.m) are shown in a fixed-width font so their columns line up.
  So are lines starting with a TAB (a table row) or two TABs (a table header),
  as written by +evcs/reports.m; the tabs themselves are not shown.
  Change the colours here to restyle the box.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #212121;          /* matches the app window behind the box */
    overflow: hidden;
  }
  #box {
    box-sizing: border-box;
    height: 100%;
    background: #30302E;          /* warm dark grey */
    color: #F5F4EF;               /* warm white */
    border: 1px solid #4A4945;
    border-radius: 10px;
    padding: 10px 14px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;        /* keep line breaks, wrap long lines */
    overflow-wrap: anywhere;
    overflow-y: auto;
  }
  .line { min-height: 1.45em; }   /* keeps blank lines visible */
  .table {
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
    font-size: 12px;
    white-space: pre;             /* table rows never wrap */
  }
  .table.head { color: #C9C7BE; font-weight: 600; }
</style>
</head>
<body>
<div id="box"></div>
<script>
  function setup(htmlComponent) {
    const box = document.getElementById("box");
    const show = () => {
      const d = htmlComponent.Data;
      const text = (d === null || d === undefined) ? "" : String(d);
      box.textContent = "";
      // one element per line; text is inserted with textContent, never as HTML
      for (const line of text.split(/\r?\n/)) {
        const el = document.createElement("div");
        el.className = "line";
        let shown = line;
        if (/^Bus No:/.test(line)) el.className += " table head";
        else if (/^b\d+:/.test(line)) el.className += " table";
        else if (/^\t\t/.test(line)) { el.className += " table head"; shown = line.slice(2); }
        else if (/^\t/.test(line))   { el.className += " table";      shown = line.slice(1); }
        el.textContent = shown;
        box.appendChild(el);
      }
    };
    htmlComponent.addEventListener("DataChanged", show);
    show();
  }
</script>
</body>
</html>
